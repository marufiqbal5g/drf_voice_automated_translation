<!DOCTYPE html>
<html>

<head>
    <title>Bangla Speech Test</title>
</head>

<body>

<h2>🎤 Bangla Voice Test</h2>

<button onclick="startRecording()">
    Start
</button>

<button onclick="stopRecording()">
    Stop
</button>

<br><br>

<div id="status">
    Idle
</div>

<br>

<div id="output">

</div>

<script>

let recorder;

let chunks=[];


async function startRecording(){

    document
    .getElementById(
        "status"
    )
    .innerText=
    "Recording...";


    const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 16000
        }
    });


    recorder=
    new MediaRecorder(
        stream
    );


    chunks=[];


    recorder.ondataavailable=
    e=>{

        if(
            e.data.size>0
        ){

            chunks.push(
                e.data
            );

        }

    };


    recorder.start();

}



async function stopRecording(){

    recorder.stop();


    recorder.onstop=
    async()=>{

        document
        .getElementById(
            "status"
        )
        .innerText=
        "Processing...";


        const blob=
        new Blob(
            chunks,
            {
                type:
                "audio/webm"
            }
        );


        let form=
        new FormData();

        form.append(
            "audio",
            blob,
            "voice.webm"
        );

        


        const response=
        await fetch(

        "/api/speech-to-text/",

        {

            method:
            "POST",

            body:
            form

        });


        const data=
        await response.json();


        console.log(
            data
        );


        document
        .getElementById(
            "status"
        )
        .innerText=
        "Done";


        document.getElementById("output").innerHTML =
        `
        <p><b>Bangla:</b> ${data.bangla_text || ""}</p>
        <p><b>English:</b> ${data.english_text || ""}</p>
        `;

    };

}

</script>

</body>

</html>
