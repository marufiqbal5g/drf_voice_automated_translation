<!DOCTYPE html>
<html>

<head>
    <title>Voice Translator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h2 {
            margin-top: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .column {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .box {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        button {
            padding: 10px 16px;
            margin-right: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #0066cc;
        }

        audio {
            width: 100%;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div id="status">Idle</div>

<div class="container">

    <!-- LEFT COLUMN -->
    <div class="column">

        <h2>🎤 Bangla Voice → English Voice Translator</h2>

        <button onclick="startRecording()">Start</button>
        <button onclick="stopRecording()">Stop</button>

        <div class="box">
            <h3>Bangla Output</h3>
            <div id="bangla_output">-</div>
        </div>

        <div class="box">
            <h3>English Output</h3>
            <div id="english_output">-</div>
        </div>

        <div class="box">
            <h3>Performance</h3>
            <div id="timings">-</div>
        </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="column">

        <h2>🎤 English Speech → Bangla Voice</h2>

        <button onclick="startEnglishRecording()">Start English Recording</button>
        <button onclick="stopEnglishRecording()">Stop English Recording</button>

        <div class="box">
            <h3>English ASR Output</h3>
            <div id="english_asr_output">-</div>
        </div>

        <div class="box">
            <h3>Bangla Output (English → Bangla)</h3>
            <div id="english_bn_output">-</div>
        </div>

        <div class="box">
            <h3>Bangla AI Voice</h3>
            <audio id="bangla_audio_player" controls></audio>
        </div>

    </div>

</div>

<script>

let recorder;
let chunks = [];

// =====================================
// Bangla → English Pipeline
// =====================================

let autoSpeak = true;

async function startRecording() {

    document.getElementById("status").innerText = "🎙 Recording Bangla...";

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 16000
        }
    });

    recorder = new MediaRecorder(stream);
    chunks = [];

    recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
    };

    recorder.start();
}

async function stopRecording() {

    recorder.stop();

    recorder.onstop = async () => {

        document.getElementById("status").innerText =
            "⬆ Uploading Bangla Audio...";

        const blob = new Blob(chunks, {
            type: "audio/webm"
        });

        let form = new FormData();
        form.append("audio", blob, "voice.webm");

        document.getElementById("status").innerText =
            "🧠 Processing Bangla Speech...";

        const response = await fetch("/api/speech-to-text/", {
            method: "POST",
            body: form
        });

        const data = await response.json();

        document.getElementById("bangla_output").innerText =
            data.bangla_text || "-";

        document.getElementById("english_output").innerText =
            data.english_text || "-";

        if (data.timings) {

            document.getElementById("timings").innerHTML = `
                Preprocess: ${data.timings.preprocess_sec}s<br>
                ASR: ${data.timings.asr_sec}s<br>
                Translation: ${data.timings.translation_sec}s<br>
                Total: ${data.timings.total_sec}s
            `;
        }

        document.getElementById("status").innerText = "✅ Bangla → English Done";

        if (autoSpeak && data.english_text) {
            playTTS(data.english_text);
        }
    };
}


// =====================================
// English TTS
// =====================================

async function playTTS(text) {

    const res = await fetch("/api/text-to-speech/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text
        })
    });

    const blob = await res.blob();

    const url = URL.createObjectURL(blob);

    const audio = new Audio(url);

    audio.play();
}


// =====================================
// English → Bangla Pipeline
// =====================================

let englishRecorder;
let englishChunks = [];

let latestBanglaText = "";

async function startEnglishRecording() {

    document.getElementById("status").innerText =
        "🎙 Recording English...";

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: true
    });

    englishRecorder = new MediaRecorder(stream);

    englishChunks = [];

    englishRecorder.ondataavailable = e => {

        if (e.data.size > 0) {
            englishChunks.push(e.data);
        }
    };

    englishRecorder.start();
}

async function stopEnglishRecording() {

    englishRecorder.stop();

    englishRecorder.onstop = async () => {

        document.getElementById("status").innerText =
            "🧠 English ASR Processing...";

        const blob = new Blob(
            englishChunks,
            {
                type: "audio/webm"
            }
        );

        let form = new FormData();

        form.append("audio", blob, "english.webm");

        const response = await fetch(
            "/api/english-speech-to-text/",
            {
                method: "POST",
                body: form
            }
        );

        const data = await response.json();

        document.getElementById("english_asr_output").innerText =
            data.english_text || "-";

        document.getElementById("status").innerText =
            "✅ English ASR Done";

        if (data.english_text) {
            translateEnglishToBangla(data.english_text);
        }
    };
}


// =====================================
// English → Bangla Translation
// =====================================

async function translateEnglishToBangla(text) {

    const res = await fetch("/api/translate-en-bn/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text
        })
    });

    const data = await res.json();

    const banglaText = data.bangla_text || "";

    document.getElementById("english_bn_output").innerText =
        banglaText;

    latestBanglaText = banglaText;

    if (banglaText) {
        playBanglaVoice(banglaText);
    }
}


// =====================================
// Bangla TTS
// =====================================

async function playBanglaVoice(text) {

    if (!text) return;

    const res = await fetch(
        "/api/bangla-text-to-speech/",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text
            })
        }
    );

    const blob = await res.blob();

    const url = URL.createObjectURL(blob);

    const player =
        document.getElementById("bangla_audio_player");

    player.src = url;

    player.play();
}

</script>

</body>
</html>
